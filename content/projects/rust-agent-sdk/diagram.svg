<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="650" viewBox="0 0 1060 650" role="img"><title>rust-agent-sdk：各应用进程内嵌入，共享用户级状态</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#272727" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="system-ui,sans-serif" fill="#202020"><text x="30" y="37" font-size="25" font-weight="650">rust-agent-sdk · 共享基础能力，保留应用边界</text><rect x="35" y="75" width="470" height="350" rx="10" stroke="#272727" stroke-width="1.5" fill="#fafafa"/><text x="51" y="106" font-size="20" font-weight="600">应用进程 A · 阅读器（示例）</text><rect x="60" y="130" width="420" height="65" rx="10" stroke="#272727" stroke-width="1.5" fill="white"/><text x="76" y="161" font-size="20" font-weight="600">段落旁的阅读交互</text><rect x="60" y="235" width="420" height="88" rx="10" stroke="#272727" stroke-width="1.5" fill="white"/><text x="76" y="266" font-size="20" font-weight="600">嵌入本进程的 SDK 实例</text><text x="76" y="293" font-size="18" font-weight="400">Agent 循环 · 模型适配 · 工具接口</text><path d="M175 195V234" fill="none" stroke="#272727" stroke-width="1.5" marker-end="url(#a)"/><path d="M340 235V196" fill="none" stroke="#272727" stroke-width="1.5" marker-end="url(#a)"/><text x="352" y="220" font-size="18" font-weight="400">事件</text><rect x="60" y="345" width="420" height="58" rx="10" stroke="#272727" stroke-width="1.5" fill="white"/><text x="76" y="376" font-size="20" font-weight="600">A 的会话 / 工作空间 / 应用记忆</text><path d="M270 323V344" fill="none" stroke="#272727" stroke-width="1.5" marker-end="url(#a)"/><rect x="555" y="75" width="470" height="350" rx="10" stroke="#272727" stroke-width="1.5" fill="#fafafa"/><text x="571" y="106" font-size="20" font-weight="600">应用进程 B · 写作工具（示例）</text><rect x="580" y="130" width="420" height="65" rx="10" stroke="#272727" stroke-width="1.5" fill="white"/><text x="596" y="161" font-size="20" font-weight="600">文档中的写作交互</text><rect x="580" y="235" width="420" height="88" rx="10" stroke="#272727" stroke-width="1.5" fill="white"/><text x="596" y="266" font-size="20" font-weight="600">嵌入本进程的 SDK 实例</text><text x="596" y="293" font-size="18" font-weight="400">Agent 循环 · 模型适配 · 工具接口</text><path d="M695 195V234" fill="none" stroke="#272727" stroke-width="1.5" marker-end="url(#a)"/><path d="M860 235V196" fill="none" stroke="#272727" stroke-width="1.5" marker-end="url(#a)"/><text x="872" y="220" font-size="18" font-weight="400">事件</text><rect x="580" y="345" width="420" height="58" rx="10" stroke="#272727" stroke-width="1.5" fill="white"/><text x="596" y="376" font-size="20" font-weight="600">B 的会话 / 工作空间 / 应用记忆</text><path d="M790 323V344" fill="none" stroke="#272727" stroke-width="1.5" marker-end="url(#a)"/><path d="M270 425V472H530V494" fill="none" stroke="#272727" stroke-width="1.5" marker-end="url(#a)"/><path d="M790 425V472H530" fill="none" stroke="#272727" stroke-width="1.5"/><rect x="110" y="500" width="840" height="85" rx="10" stroke="#272727" stroke-width="1.5" fill="#f4dc79"/><text x="126" y="531" font-size="20" font-weight="600">同一用户的公共目录</text><text x="126" y="558" font-size="18" font-weight="400">模型配置 / 凭据　　　　全局记忆 / 每日记忆　　　　应用注册</text><text x="30" y="625" font-size="18" font-weight="400">共享文件与接口；没有统一常驻 Agent 服务。应用级分区并非操作系统安全隔离。</text></g></svg>