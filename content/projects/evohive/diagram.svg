<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="680" viewBox="0 0 1060 680" role="img"><title>EvoHive：角色分工与可审阅知识反馈</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#272727" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="system-ui,sans-serif" fill="#202020"><text x="30" y="36" font-size="25" font-weight="650">EvoHive · 一个入口，分工执行，经验回流</text><rect x="412" y="65" width="220" height="66" rx="10" stroke="#272727" stroke-width="1.5" fill="white"/><text x="428" y="96" font-size="20" font-weight="600">用户需求与方案确认</text><path d="M522 131V177" fill="none" stroke="#272727" stroke-width="1.5" marker-end="url(#a)"/><rect x="412" y="180" width="220" height="78" rx="10" stroke="#272727" stroke-width="1.5" fill="#f4dc79"/><text x="428" y="211" font-size="20" font-weight="600">LEADER</text><text x="428" y="238" font-size="18" font-weight="400">协调评估 · 组织交付</text><rect x="85" y="160" width="235" height="80" rx="10" stroke="#272727" stroke-width="1.5" fill="white"/><text x="101" y="191" font-size="20" font-weight="600">HR / 角色</text><text x="101" y="218" font-size="18" font-weight="400">复用或创建 Worker</text><rect x="85" y="290" width="235" height="80" rx="10" stroke="#272727" stroke-width="1.5" fill="white"/><text x="101" y="321" font-size="20" font-weight="600">IT / 能力</text><text x="101" y="348" font-size="18" font-weight="400">寻找或编写技能</text><rect x="740" y="160" width="235" height="80" rx="10" stroke="#272727" stroke-width="1.5" fill="white"/><text x="756" y="191" font-size="20" font-weight="600">FIN / 预算</text><text x="756" y="218" font-size="18" font-weight="400">估算与记录消耗</text><rect x="740" y="290" width="235" height="80" rx="10" stroke="#272727" stroke-width="1.5" fill="white"/><text x="756" y="321" font-size="20" font-weight="600">KB / 知识</text><text x="756" y="348" font-size="18" font-weight="400">找到适用的方法</text><path d="M412 205H320"