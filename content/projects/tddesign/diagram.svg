<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="715" viewBox="0 0 1060 715" role="img"><title>TDDesign：从生成偏差与人工纠正到可复用约束</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#272727" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="system-ui,sans-serif" fill="#202020"><text x="30" y="37" font-size="25" font-weight="650">TDDesign · 让一次纠正进入下一次生成</text><text x="43" y="84" font-size="21" font-weight="600">想要的页面</text><text x="394" y="84" font-size="21" font-weight="600">生成中的偏差</text><text x="750" y="84" font-size="21" font-weight="600">人工纠正</text><rect x="40" y="102" width="275" height="220" rx="10" stroke="#272727" stroke-width="1.5" fill="white"/><text x="56" y="133" font-size="20" font-weight="600"></text><path d="M61 132H292M61 276H292" stroke="#aaa"/><text x="64" y="178" font-size="21" font-weight="600">一个明确的重点</text><text x="64" y="211" font-size="18" font-weight="400">内容留出足够空间</text><rect x="63" y="239" width="95" height="26" fill="#222" rx="2"/><rect x="390" y="102" width="275" height="220" rx="10" stroke="#272727" stroke-width="1.5" fill="#f5f5f3"/><text x="406" y="133" font-size="20" font-weight="600"></text><text x="408" y="142" font-size="18" font-weight="600">标题 / 信息 / 装饰</text><rect x="408" y="162" width="64" height="31" rx="13" fill="white" stroke="#777"/><rect x="408" y="211" width="64" height="31" rx="13" fill="white" stroke="#777"/><rect x="408" y="260" width="64" height="31" rx="13" fill="white" stroke="#777"/><rect x="486" y="162" width="64" height="31" rx="13" fill="white" stroke="#777"/><rect x="486" y="211" width="64" height="31" rx="13" fill="white" stroke="#777"/><rect x="486" y="260" width="64" height="31" rx="13" fill="white" stroke="#777"/><rect x="564" y="162" width="64" height="31" rx="13" fill="white" stroke="#777"/><rect x="564" y="211" width="64" height="31" rx="13" fill="white" stroke="#777"/><rect x="564" y="260" width="64" height="31" rx="13" fill="white" stroke="#777"/><path d="M320 211H383" fill="none" stroke="#272727" stroke-width="1.5" marker-end="url(#a)"/><text x="329" y="194" font-size="18" font-weight="400">生成</text><rect x="740" y="102" width="275" height="220" rx="10" stroke="#272727" stroke-width="1.5" fill="white"/><text x="756" y="133" font-size="20" font-weight="600">减少同时竞争的元素</text><text x="756" y="160" font-size="18" font-weight="400">调整间距与组件形式</text><text x="757" y="211" font-size="18" font-weight="400">这是本页的例外？</text><text x="757" y="243" font-size="18" font-weight="400">还是可复用的偏好？</text><path d="M671 211H732" fill="none" stroke="#272727" stroke-width="1.5" marker-end="url(#a)"/><rect x="390" y="427" width="325" height="125" rx="10" stroke="#272727" stroke-width="1.5" fill="#f4dc79"/><text x="406" y="458" font-size="20" font-weight="600">DESIGN.md</text><text x="406" y="485" font-size="18" font-weight="400">设计说明：指导生成</text><text x="407" y="514" font-size="18" font-weight="400">检查项：核对明确要求</text><text x="408" y="538" font-size="18" font-weight="400">保留适用范围</text><path d="M877 322V388H552V420" fill="none" stroke="#272727" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="696" y="376" font-size="18" font-weight="400">规划：确认并转成规则</text><rect x="40" y="436" width="275" height="101" rx="10" stroke="#272727" stroke-width="1.5" fill="white"/><text x="56" y="467" font-size="20" font-weight="600">可视化偏好选择</text><text x="56" y="494" font-size="18" font-weight="400">先比较画面，再确认要求</text><path d="M315 485H383" fill="none" stroke="#272727" stroke-width="1.5" marker-end="url(#a)"/><rect x="780" y="436" width="235" height="101" rx="10" stroke="#272727" stroke-width="1.5" fill="white"/><text x="796" y="467" font-size="20" font-weight="600">客观检查</text><text x="796" y="494" font-size="18" font-weight="400">页面样式 → 逐项结果</text><path d="M715 485H773" fill="none" stroke="#272727" stroke-width="1.5" marker-end="url(#a)"/><path d="M430 427V363H177V329" fill="none" stroke="#272727" stroke-width="1.5" marker-end="url(#a)"/><text x="209" y="383" font-size="18" font-weight="400">已有：为后续生成提供规范</text><path d="M1015 485H1035V250H1020" fill="none" stroke="#272727" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="577" y="620" font-size="18" font-weight="400">人工判断仍保留；主观检查尚未实现</text><text x="30" y="685" font-size="18" font-weight="400">页面片段是概念示意，不是产品截图。实线：已有流程；虚线：规划中的纠正反馈。</text></g></svg>