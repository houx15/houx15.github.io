<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 610" role="img" aria-labelledby="t d"><title id="t">SuperPaper · 两次会话，同一份研究项目</title><desc id="d">设计示意，不是真实用户数据或运行结果。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#424242" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif" fill="#252525"><text x="32" y="40" font-size="26" font-weight="600" fill="#252525">两次会话，同一份研究项目</text><text x="32" y="69" font-size="16" font-weight="400" fill="#666">连续性来自可以检查、修改和接续的材料</text><rect x="335" y="113" width="410" height="418" rx="12" fill="#fafafa" stroke="#333"/><text x="359" y="148" font-size="21" font-weight="600" fill="#252525">共享项目状态</text><rect x="355" y="172" width="370" height="89" rx="8" fill="white" stroke="#b7b7b7"/><text x="372" y="199" font-size="18" font-weight="600" fill="#252525">章节与证据</text><text x="372" y="223" font-size="16" font-weight="400" fill="#252525">某节提纲 → 对应主张</text><text x="372" y="245" font-size="16" font-weight="400" fill="#252525">文献笔记、分析结果 → 支持材料</text><rect x="355" y="277" width="370" height="89" rx="8" fill="white" stroke="#b7b7b7"/><text x="372" y="304" font-size="18" font-weight="600" fill="#252525">已经作出的决定</text><text x="372" y="328" font-size="16" font-weight="400" fill="#252525">采用的概念与定义</text><text x="372" y="350" font-size="16" font-weight="400" fill="#252525">修改理由、章节当前状态</text><rect x="355" y="382" width="370" height="89" rx="8" fill="white" stroke="#b7b7b7"/><text x="372" y="409" font-size="18" font-weight="600" fill="#252525">尚未解决的问题</text><text x="372" y="433" font-size="16" font-weight="400" fill="#252525">某个论点还缺证据</text><text x="372" y="455" font-size="16" font-weight="400" fill="#252525">下一次先核对什么</text><text x="358" y="509" font-size="15" font-weight="400" fill="#666">meta/   ·   writings/   ·   references/</text><text x="32" y="206" font-size="22" font-weight="600" fill="#252525">会话 A</text><text x="32" y="242" font-size="17" font-weight="400" fill="#252525">组织本节论点</text><text x="32" y="271" font-size="17" font-weight="400" fill="#252525">记录已确定的内容</text><text x="32" y="300" font-size="17" font-weight="400" fill="#252525">留下尚缺的依据</text><text x="792" y="206" font-size="22" font-weight="600" fill="#252525">会话 B</text><text x="792" y="242" font-size="17" font-weight="400" fill="#252525">恢复当前焦点</text><text x="792" y="271" font-size="17" font-weight="400" fill="#252525">沿着未解问题继续</text><text x="792" y="300" font-size="17" font-weight="400" fill="#252525">更新论点与材料</text><path d="M215 328 C265 328 281 328 322 328" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/><text x="232" y="315" font-size="15" font-weight="400" fill="#252525">写回</text><path d="M755 230 C771 230 778 230 788 230" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/><text x="755" y="214" font-size="14" font-weight="400" fill="#252525">读取</text><path d="M864 350 C864 421 805 457 755 457" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><text x="840" y="397" font-size="15" font-weight="400" fill="#252525">再更新</text><circle cx="369" cy="425" r="4" fill="#e6bf41"/><text x="32" y="578" font-size="15" font-weight="400" fill="#666">关系示意 · 条目为说明设计而设，不是实际论文内容</text></g></svg>