# Certbot will add TLS and the HTTP-to-HTTPS redirect for this server block.
server {
    listen 80;
    listen [::]:80;
    server_name agent.kookat.icu;
    client_max_body_size 8k;
    client_body_timeout 10s;
    access_log off;

    location = /health {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
    }

    location /v2/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        # Overwrite, never append a client-supplied address.
        proxy_set_header X-Portfolio-Client-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    location / { return 404; }
}
